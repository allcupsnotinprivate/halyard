[project]
name = "halyard-runtime"
version = "0.1.0"
description = "Halyard runtime: the App facade, component autodiscovery and env configuration"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "allcupsnotinprivate" }]
dependencies = [
    "halyard-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyard"]

[tool.uv.sources]
halyard-core = { workspace = true }
