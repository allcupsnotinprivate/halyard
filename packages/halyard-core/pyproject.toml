[project]
name = "halyard-core"
version = "0.1.0"
description = "Halyard core"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "allcupsnotinprivate" }]
dependencies = [
    "anyio>=4",
    "opentelemetry-api>=1.26,<2",
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyard"]
