[project]
name = "halyard-core"
version = "0.1.0"
description = "Halyard core - DI, actions/providers, tenancy, observability primitives"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [{ name = "allcupsnotinprivate" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyard"]
