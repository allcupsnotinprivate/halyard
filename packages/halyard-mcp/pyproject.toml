[project]
name = "halyard-mcp"
version = "0.1.0"
description = "Halyard MCP: expose component invocables as Model Context Protocol tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "allcupsnotinprivate" }]
dependencies = [
    "halyard-runtime",
    "mcp>=2.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyard"]

[tool.uv.sources]
halyard-runtime = { workspace = true }
