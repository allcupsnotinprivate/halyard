site_name: Warpweft
site_description: A declarative framework for resilient, observable service components.
site_url: https://allcupsnotinprivate.github.io/warpweft/
repo_url: https://github.com/allcupsnotinprivate/warpweft
repo_name: allcupsnotinprivate/warpweft
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            show_if_no_docstring: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - toc: { permalink: true }

nav:
  - Home: index.md
  - Getting started:
      - Write your first component: first-component.md
  - Guides:
      - Runtime: runtime.md
      - Composition: composition.md
      - Field formats: formats.md
      - Telemetry: telemetry.md
      - Logging: logging.md
      - MCP tools: mcp.md
  - API reference: reference/
