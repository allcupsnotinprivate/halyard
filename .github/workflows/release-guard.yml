name: Release guard

# Runs on every PR into main: makes sure the version in pyproject.toml is
# releasable BEFORE merge, so the post-merge publish can never fail on a
# duplicate/invalid version.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    name: version is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags for the monotonicity check

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Read version from pyproject.toml
        id: ver
        run: |
          v=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $v"

      - name: Valid PEP 440 and not older than the latest tag
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os, subprocess, sys
          from packaging.version import Version, InvalidVersion

          v = os.environ["V"]
          try:
              new = Version(v)
          except InvalidVersion as e:
              sys.exit(f"::error::Invalid PEP 440 version '{v}': {e}")

          tags = subprocess.run(
              ["git", "tag", "-l", "v*", "--sort=-v:refname"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          if tags:
              old = Version(tags[0][1:])
              if new < old:
                  sys.exit(f"::error::Version {new} is lower than the latest tag {old}.")
              if new == old:
                  print(f"Version unchanged ({new}); merging this PR will NOT publish a release.")
                  raise SystemExit(0)
          print(f"Version {new} looks releasable.")
          PY

      - name: Version not already published on PyPI
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          code=$(curl -sS -o /tmp/pypi.json -w '%{http_code}' "https://pypi.org/pypi/warpweft/json" || echo 000)
          if [ "$code" = "404" ]; then
            echo "warpweft is not on PyPI yet — first release, OK."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::warning::Could not query PyPI (HTTP $code); skipping the duplicate check."
            exit 0
          fi
          if jq -e --arg v "$V" '.releases | has($v)' /tmp/pypi.json >/dev/null; then
            echo "::error::Version $V is already published on PyPI. Bump the version in pyproject.toml."
            exit 1
          fi
          echo "Version $V is free on PyPI."

      - name: Build and validate package metadata
        run: |
          uv build -o dist
          uvx twine check dist/*
