name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy src
      - name: Tests (coverage gate 90%)
        run: uv run pytest --cov=halyard --cov-report=term

  wheel-smoke:
    name: wheel installs into clean venv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: uv build -o dist
      - name: Install (base) into a clean venv and import
        run: |
          uv venv /tmp/smoke --python 3.11
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import halyard; from halyard import App, AComponent; print(halyard.__version__)"
      - name: Install with the mcp extra and import halyard.mcp
        run: |
          uv venv /tmp/smoke-mcp --python 3.11
          uv pip install --python /tmp/smoke-mcp/bin/python "halyard[mcp] @ $(ls dist/*.whl)"
          /tmp/smoke-mcp/bin/python -c "import halyard.mcp; from halyard.mcp import tool; print('mcp extra ok')"
