name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace (frozen)
        run: uv sync --frozen --all-packages
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run --all-packages mypy $(find packages -maxdepth 3 -name src -type d)
      - name: Tests (coverage gate 90%)
        run: uv run pytest --cov=halyard --cov-report=term

  wheel-smoke:
    name: wheel installs into clean venv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Build wheels
        run: |
          uv build --package halyard-core -o dist
          uv build --package halyard-runtime -o dist
      - name: Install into clean venv and import
        run: |
          uv venv /tmp/smoke --python 3.11
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import halyard.core, halyard.runtime; print(halyard.core.__version__)"
